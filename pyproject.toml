[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hogline2"
version = "0.1.0"
description = "Curling recordings split into ends, with stone tracking and shot review"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "pillow>=11,<14",
    "stonetrack",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.uv.sources]
stonetrack = { path = "stonetrack", editable = true }

[project.scripts]
hogline2 = "hogline2.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hogline2"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "stonetrack/tests"]
